name: Disposable sandbox smoke test

on:
  workflow_run:
    workflows: ["Evaluation foundation checks"]
    types: [completed]

permissions:
  statuses: write

jobs:
  sandbox-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    name: Verify disposable no-credential sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create synthetic read-only source snapshot
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/fm-sandbox-input"
          mkdir -p "$input_dir"
          printf '%s\n' 'FutureMinds synthetic sandbox input' > "$input_dir/instruction.txt"
          echo "input_dir=$input_dir" >> "$GITHUB_ENV"

      - name: Pull pinned minimal sandbox image
        shell: bash
        run: |
          set -euo pipefail
          docker pull docker.io/library/busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4

      - name: Run constrained sandbox proof
        id: sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 32 \
            --memory 128m \
            --cpus 0.5 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534 \
            --tmpfs /output:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534 \
            --mount "type=bind,source=$input_dir,target=/input,readonly" \
            --workdir /input \
            docker.io/library/busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4 \
            sh -eu -c '
              test "$(id -u)" -ne 0
              test -r /input/instruction.txt
              if touch /input/should-not-write 2>/dev/null; then
                echo "ERROR: source snapshot was writable"
                exit 11
              fi
              if ! grep -E "^[^ ]+ / [^ ]+ ro[, ]" /proc/mounts >/dev/null; then
                echo "ERROR: root filesystem is not read-only"
                exit 12
              fi
              grep -Eq "CapEff:[[:space:]]*0000000000000000" /proc/self/status
              if env | cut -d= -f1 | grep -Eiq "(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|SUPABASE|VERCEL)"; then
                echo "ERROR: sensitive environment variable name detected"
                exit 13
              fi
              if wget -T 2 -O /dev/null http://1.1.1.1/ >/dev/null 2>&1; then
                echo "ERROR: outbound network unexpectedly available"
                exit 14
              fi
              printf "sandbox-proof:%s\n" "$(cat /input/instruction.txt)" > /output/result.txt
              sha256sum /output/result.txt
              echo "SANDBOX_PROOF=passed"
            '

      - name: Publish sandbox proof status
        if: always() && github.event.workflow_run.head_repository.full_name == github.repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$SANDBOX_OUTCOME" = "success" ]; then
            state="success"
            description="Constrained no-credential sandbox smoke passed"
          else
            state="failure"
            description="Constrained sandbox smoke failed; inspect workflow logs"
          fi
          payload="$(jq -n --arg state "$state" --arg description "$description" --arg context "FutureMinds Intelligence / Disposable sandbox" --arg target_url "$STATUS_URL" '{state:$state,description:$description,context:$context,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -d "$payload"

      - name: Remove synthetic source snapshot
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/fm-sandbox-input"
