name: Evaluation foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-evaluation-cases:
    name: Validate cases and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evaluation case definitions
        run: python scripts/validate_evals.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Produce passing evidence report
        run: python -m scripts.run_eval --case evals/cases/agent-claim-evidence.v1.json --evidence evals/fixtures/evidence-passed.json

