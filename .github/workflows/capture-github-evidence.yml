name: Capture independent GitHub evidence

on:
  workflow_run:
    workflows: ["Evaluation foundation checks"]
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  collect-evidence:
    name: Collect commit and CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect read-only GitHub evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m scripts.collect_github_evidence
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: github-evidence-${{ github.event.workflow_run.id }}
          path: evidence/github-evidence.json
          if-no-files-found: error
          retention-days: 14
